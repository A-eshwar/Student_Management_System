<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
    <h2>REGISTER</h2>
    <form onsubmit="validation(event)">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <button type="submit">Register</button>
        <hr>
        <p id="duplicate" style="color: red;"></p>
        <div class="form-footer">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </form>
    <script>
        async function validation(event) {
            event.preventDefault();
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;
            const cpass = document.getElementById("confirm_password").value;
            var obj = {
                "name": username,
                "email": email,
                "pass": pass
            };
            const result=await fetch("http://localhost:3000/users")
            const userData=await result.json();
            const matchedUser = userData.find(user => user.name===username && user.pass===pass)
            if(matchedUser){
                alert("username already exist")
                return;
            }
            if(pass===cpass){
                const res=await fetch("http://localhost:3000/users",{
                    method:"POST",
                    body:JSON.stringify(obj)
                });
                alert("Registered successfully")
                window.location.href="login.html";
            }
            else{
                alert("incorrect passwords");
                return;
            }
        }
    </script>
</body>

</html>
