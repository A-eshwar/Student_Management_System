<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add_student.html">Add Student</a>
        <a href="view_student.html">View Students</a>
        <a href="logout.html">Logout</a>
    </nav>
    <h2>ADD STUDENT</h2>
    <form onsubmit="add_student(event)" method="POST">
        <label for="rollno">Roll No:</label>
        <input type="text" id="rollno" name="rollno" required>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="grade">Grade:</label>
        <input type="text" id="grade" name="grade" required>

        <button type="submit">Add Student</button>
    </form>
</body>
<script>
    async function add_student(event) {
        event.preventDefault();
        
        const rollno = document.getElementById("rollno").value;
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;
        const email = document.getElementById("email").value;
        const grade = document.getElementById("grade").value;
        
        const studentObj = {
            rollno: rollno,
            name: name,
            age: age,
            email: email,
            grade: grade
        };
            const response = await fetch("http://localhost:3000/students", {
                method: "POST",
                body: JSON.stringify(studentObj)
            });
            
            if (response.ok) {
                alert("Student added successfully!");
                window.location.href = "view_student.html";
            } else {
                alert("Failed to add student to the database.");
            }
    }
</script>

</html>
