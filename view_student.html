<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>View Students - Student Management System</title>
    <style>
        .edit-btn {
            color: blue;
            text-decoration: none;
            padding: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        .edit-btn:hover {
            text-decoration: none;
            background-color: white;
            color: blue;
        }

        .delete-btn {
            color: red;
            text-decoration: none;
            padding: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        .delete-btn:hover {
            text-decoration: none;
            background-color: white;
            color: red;
        }
    </style>
</head>

<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add_student.html">Add Student</a>
        <a href="view_student.html">View Students</a>
        <a href="logout.html">Logout</a>
    </nav>
    <h2>VIEW STUDENTS</h2>
    <table border="1" id="studentTable">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Edit</th>
            <th>Delete</th>
        </tr>
    </table>
</body>
<script>
    window.onload = function () {
        renderTable();
    };

    async function renderTable() {
        const table = document.getElementById("studentTable");
        
        while (table.rows.length > 1) {
            table.deleteRow(1);
        }
        const response = await fetch("http://localhost:3000/students");
        const students = await response.json(); 
            
        students.forEach(student => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${student.rollno}</td>
                <td>${student.name}</td>
                <td>${student.age}</td>
                <td>${student.grade}</td>
                <td><a href="edit_student.html?id=${student.id}" class="edit-btn">EDIT</a></td>
                <td><a href="#" onclick="deleteStudent(event, '${student.id}')" class="delete-btn">DELETE</a></td>
            `;
            table.appendChild(row);
        });
    }
    async function deleteStudent(event, id) {
        event.preventDefault();
        if (confirm("Are you sure you want to permanently delete this student?")) {
            const response = await fetch(`http://localhost:3000/students/${id}`, {
                method: "DELETE"
            });    
            if (response.ok) {
                renderTable();
            } else {
                alert("Failed to delete the student from the server.");
            }
        }
    }
</script>

</html>
