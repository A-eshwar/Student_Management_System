<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add_student.html">Add Student</a>
        <a href="view_student.html">View Students</a>
        <a href="logout.html">Logout</a>
    </nav>
    <h2>EDIT STUDENT DETAILS</h2>
    <form onsubmit="update_student(event)" method="GET">
        <label for="student_id">Student ID:</label>
        <input type="text" id="student_id" name="student_id" readonly
            style="background-color: #e9e9e9; cursor: not-allowed;">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="grade">Grade:</label>
        <input type="text" id="grade" name="grade" required>

        <button type="submit">Save Changes</button>
    </form>
</body>
<script>
    window.onload = function () {
        const urlp = new URLSearchParams(window.location.search);
        const studentId = urlp.get('id');
        if (!studentId) {
            alert("No student selected to edit.");
            window.location.href = "view_student.html";
            return;
        }
        let students = JSON.parse(localStorage.getItem("students")) || [];
        const student = students.find(s => s.id === studentId);
        if (student) {
            document.getElementById("student_id").value = student.id;
            document.getElementById("name").value = student.name;
            document.getElementById("age").value = student.age;
            document.getElementById("email").value = student.email || "";
            document.getElementById("grade").value = student.grade;
        } else {
            alert("Student record could not be found.");
            window.location.href = "view_student.html";
        }
    };
    function update_student(event) {
        event.preventDefault();
        const id = document.getElementById("student_id").value;
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;
        const email = document.getElementById("email").value;
        const grade = document.getElementById("grade").value;
        let students = JSON.parse(localStorage.getItem("students")) || [];
        students = students.map(s => {
            if (s.id === id) {
                return { id, name, age, email, grade };
            }
            return s;
        });
        localStorage.setItem("students", JSON.stringify(students));
        alert("Student details updated");
        window.location.href = "view_student.html";
    }
</script>

</html>
