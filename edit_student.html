<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add_student.html">Add Student</a>
        <a href="view_student.html">View Students</a>
        <a href="logout.html">Logout</a>
    </nav>
    <h2>EDIT STUDENT DETAILS</h2>
    <form onsubmit="update_student(event)" method="POST">
        <input type="hidden" id="id" name="id">
        <label for="rollno">Roll No:</label>
        <input type="text" id="rollno" name="rollno" readonly
            style="background-color: #e9e9e9; cursor: not-allowed;">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="grade">Grade:</label>
        <input type="text" id="grade" name="grade" required>

        <button type="submit">Save Changes</button>
    </form>
</body>
<script>
window.onload = async function() {
    const urlp = new URLSearchParams(window.location.search);
    const id = urlp.get('id');

    if (!id) {
        alert("No student selected to edit.");
        window.location.href = "view_student.html";
        return;
    }
    const response = await fetch(`http://localhost:3000/students/${id}`);
    const student = await response.json();
    document.getElementById("id").value = student.id;
    document.getElementById("rollno").value = student.rollno;
    document.getElementById("name").value = student.name;
    document.getElementById("age").value = student.age;
    document.getElementById("email").value = student.email;
    document.getElementById("grade").value = student.grade;
};

async function update_student(event) {
    event.preventDefault();

    const id = document.getElementById("id").value;
    const rollno = document.getElementById("rollno").value;
    const name = document.getElementById("name").value;
    const age = parseInt(document.getElementById("age").value, 10) || 0;
    const email = document.getElementById("email").value;
    const grade = document.getElementById("grade").value;

    const upstu = { rollno, name, age, email, grade };

    const response = await fetch(`http://localhost:3000/students/${id}`, {
        method: "PUT",
        body: JSON.stringify(upstu)
    });
    if (response.ok) {
        alert("Student details updated");
        window.location.href = "view_student.html";
    } else {
        alert("Failed to update student details on the server.");
    }
}
</script>

</html>
